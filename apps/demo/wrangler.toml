name = "croupier-demo"
main = "server/workers/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "client/dist"

[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoomDO" },
  { name = "LOBBY", class_name = "LobbyDO" },
]

[[migrations]]
tag = "v1"
new_classes = ["GameRoomDO", "LobbyDO"]
