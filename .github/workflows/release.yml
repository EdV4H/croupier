name: Release

# Opens a "Version Packages" PR from pending changesets, and publishes
# @croupier/* to the registry once that PR is merged.
#
# Inert until configured. Repository settings:
#   vars.RELEASE_ENABLED   "true" to enable this workflow
#   vars.NPM_REGISTRY_URL  registry URL (default: https://registry.npmjs.org)
#                          e.g. https://npm.pkg.github.com for GitHub Packages
#   secrets.NPM_TOKEN      publish token (falls back to GITHUB_TOKEN for GitHub Packages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter="./packages/*"
      - run: pnpm turbo test --filter="./packages/*"
      - uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
