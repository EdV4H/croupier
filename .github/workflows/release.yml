name: Release

# Opens a "Version Packages" PR from pending changesets, and publishes
# @edv4h/croupier-* to npm once that PR is merged.
#
# Auth: npm trusted publishing (OIDC). Register this repository + workflow
# (release.yml) as a trusted publisher for each package on npmjs.com.
# For the very first publish (before the packages exist on npm), set
# secrets.NPM_TOKEN; it can be removed once trusted publishing is configured.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 (pnpm publish delegates to npm)
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter="./packages/*"
      - run: pnpm turbo test --filter="./packages/*"
      - uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
